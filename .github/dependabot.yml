version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "kkebo"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "kkebo"
    commit-message:
      prefix: "build"
    groups:
      vim:
        patterns:
          - ".vim/pack/plugins/*"
      tmux:
        patterns:
          - ".config/tmux/plugins/*"
